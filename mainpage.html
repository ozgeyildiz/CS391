<html>

<head>
    <meta charset="utf-8">
    <meta name="description" content="FiverrClone">
    <meta name="author" content="CS391 Project">
    <link rel="stylesheet" href="./css/layout.css"/>
    <title>FIVERR</title>
</head>

<body>

<div id="header">
    <a href="mainpage.html">
        <img id="logo" src="./res/fiverr2.png">

    </a>

    <a href="./gigs.html">
        <h2 id="gigs">Gigs</h2>
    </a>
    
    <a href="./profile.html">
        <h2 id="profileButton">Profile</h2>
    </a>

</div>



<section>

    <form id="loginform" method="post" onsubmit="login()">
        <h2 style="color: rgb(108, 238, 188); margin-right: 15px; margin-top: 50px;">Sign In</h2>

        <label for username>Username: </label>
        <br>
        <input id="usernameLogin" type="text" minlength="5" maxlength="15" required>
        <br>

        <label for password>Password:</label>
        <br>
        <input id="passwordLogin" type="password" minlength="6" required>
        <br>

        <input style="margin-top: 10px;" type="submit" value="Sign in">

    </form>

    
    <div id="signinform">
        <h2 style="color: rgb(108, 238, 188); margin-right: 15px; margin-top: 50px;">Register</h2>

        <form id="userreg" method="post" action="course.html" onsubmit="registerUser()">

            <label for mail>Mail address:</label>
            <br>
            <input id="mail" type="email" placeholder="Enter your Email Address" required>
            <br>
            <label for username>Username:</label>
            <br>
            <input id="username" type="text" minlength="4" maxlength="20" required>
            <br>
            <label for password>Password:</label>
            <br>
            <input id="password" type="password" minlength="6" required>
            <br>

            <label for firstname>Full Name:</label>
            <br>
            <input id="name" type="text" maxlength="30" required>
            <br>


            <label for country>Country:</label>
            <br>
            <select name="country" id="country" selected="Turkey" required>
                <option value="Turkey">Tr</option>
                <option value="United States">Us</option>
                <option value="New Zealand">Nz</option>
                <option value="Germany">Gr</option>
            </select>
            <br>
            <input style="margin-top: 5px;" type="submit" value="Register">
        </form>


        
    </div>
    <div id="profile">
        <div class="userProfile">
            <h3 id="name">Welcome back buyer, {name}!</h3>
            <p id="email">Email: {email}</p>
            <p>
                <button id="signOutButton" onclick="logout()" type="button">Sign Out</button>
            </p>
        </div>
    </div>
    <div>
        <article class="talentArticle">
            <h2>Discover Great Talent</h2>
            <p>Curated Talent Awaits You</p>
        </article>

        <article class="thingsArticle">
            <h2>Get Things Done</h2>
            <p>We have an outstanding team ready to accomplish your most demanding tasks</p>
        </article>

    </div>

</section>

<footer>
    <img id="footerlogo" src="./res/fiverr.jpg">
    <article id="footer">
        FIVERR INTERNATIONAL
    </article>
    
</footer>

</body>

</html>
